<!DOCTYPE html>
<!--
  Purpose: Home page for potatogalaxy.com. Shows the hero art and the list of games.

  TODO:
   - Add Open Graph tags (og:title, og:image, og:url) once the final domain
     form (apex or www) is decided, so link previews work when shared.
   - Add each new game as another <article class="game"> in the Games section.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Potato Galaxy | Mobile games for iPhone and Android</title>
  <meta name="description" content="Potato Galaxy makes mobile games for iPhone and Android. Next up: Potato Galaxy Sudoku, a puppy-themed sudoku game.">
  <meta name="theme-color" content="#120b2e">
  <!-- Inline emoji favicon: no extra file, no 404 for /favicon.ico -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A5%94%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <!-- defer: runs after the page is parsed, never blocks rendering -->
  <script src="js/potatoes.js" defer></script>
</head>
<body>
  <!-- Lets keyboard users skip the navigation -->
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Potato drawing, defined once and reused by every falling potato below.
       Two faces: #potato (happy) and #potato-wow (surprised, shown when clicked). -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <g id="potato-body">
        <path d="M50 10 C47 2 54 -5 62 -2 C62 6 56 10 50 10 Z" fill="#7cc36a" stroke="#3f7a35" stroke-width="3" stroke-linejoin="round"/>
        <path d="M50 8 C72 6 92 22 92 48 C94 72 76 93 50 92 C26 94 7 76 9 50 C7 26 26 9 50 8 Z" fill="var(--skin)" stroke="var(--line)" stroke-width="4"/>
        <g fill="var(--line)" opacity="0.3">
          <ellipse cx="27" cy="30" rx="5" ry="3.5"/>
          <ellipse cx="72" cy="27" rx="4" ry="3"/>
          <ellipse cx="68" cy="78" rx="5" ry="3.5"/>
          <ellipse cx="30" cy="76" rx="3.5" ry="2.5"/>
        </g>
        <ellipse cx="28" cy="58" rx="6" ry="3.5" fill="#ff7a7a" opacity="0.7"/>
        <ellipse cx="72" cy="58" rx="6" ry="3.5" fill="#ff7a7a" opacity="0.7"/>
      </g>
    </defs>
    <symbol id="potato" viewBox="0 -8 100 108">
      <use href="#potato-body"/>
      <circle cx="38" cy="48" r="4.5" fill="#2b1608"/>
      <circle cx="62" cy="48" r="4.5" fill="#2b1608"/>
      <path d="M43 58 Q50 66 57 58" fill="none" stroke="#2b1608" stroke-width="3" stroke-linecap="round"/>
    </symbol>
    <symbol id="potato-wow" viewBox="0 -8 100 108">
      <use href="#potato-body"/>
      <circle cx="37" cy="46" r="7" fill="#fff"/>
      <circle cx="63" cy="46" r="7" fill="#fff"/>
      <circle cx="37" cy="46" r="3.5" fill="#2b1608"/>
      <circle cx="63" cy="46" r="3.5" fill="#2b1608"/>
      <ellipse cx="50" cy="64" rx="5" ry="6.5" fill="#2b1608"/>
    </symbol>
  </svg>

  <!-- Falling potatoes: decoration only, hidden from screen readers.
       Each one sets its own position, size, speed and colour; the motion is in style.css.
       Clicking one makes it jump (js/potatoes.js). -->
  <div class="potato-sky" aria-hidden="true">
    <svg class="spud" style="--x:4%;--size:5.25rem;--time:30s;--delay:-3s;--drift:5vw;--spin:220deg;--rest:12%;--skin:#c58b4e;--line:#7a4a22"><use href="#potato"/></svg>
    <svg class="spud" style="--x:17%;--size:3rem;--time:22s;--delay:-14s;--drift:-3vw;--spin:-300deg;--rest:58%;--skin:#8d62c4;--line:#4b2c7c"><use href="#potato"/></svg>
    <svg class="spud" style="--x:29%;--size:4.125rem;--time:34s;--delay:-22s;--drift:4vw;--spin:160deg;--rest:82%;--skin:#b5583a;--line:#6e2c1a"><use href="#potato"/></svg>
    <svg class="spud" style="--x:43%;--size:2.625rem;--time:24s;--delay:-8s;--drift:-4vw;--spin:340deg;--rest:30%;--skin:#e0b56a;--line:#8c6226"><use href="#potato"/></svg>
    <svg class="spud" style="--x:56%;--size:4.5rem;--time:28s;--delay:-18s;--drift:3vw;--spin:-200deg;--rest:68%;--skin:#c58b4e;--line:#7a4a22"><use href="#potato"/></svg>
    <svg class="spud" style="--x:69%;--size:3.375rem;--time:20s;--delay:-1s;--drift:-5vw;--spin:280deg;--rest:18%;--skin:#8d62c4;--line:#4b2c7c"><use href="#potato"/></svg>
    <svg class="spud" style="--x:81%;--size:6rem;--time:36s;--delay:-27s;--drift:-3vw;--spin:-140deg;--rest:46%;--skin:#b5583a;--line:#6e2c1a"><use href="#potato"/></svg>
    <svg class="spud" style="--x:91%;--size:3rem;--time:25s;--delay:-11s;--drift:-6vw;--spin:320deg;--rest:88%;--skin:#e0b56a;--line:#8c6226"><use href="#potato"/></svg>
    <svg class="spud" style="--x:36%;--size:3.75rem;--time:32s;--delay:-29s;--drift:6vw;--spin:-260deg;--rest:5%;--skin:#c58b4e;--line:#7a4a22"><use href="#potato"/></svg>
    <svg class="spud" style="--x:75%;--size:2.625rem;--time:23s;--delay:-17s;--drift:2vw;--spin:240deg;--rest:76%;--skin:#e0b56a;--line:#8c6226"><use href="#potato"/></svg>
    <svg class="spud" style="--x:11%;--size:3.75rem;--time:27s;--delay:-20s;--drift:3vw;--spin:-180deg;--rest:38%;--skin:#e0b56a;--line:#8c6226"><use href="#potato"/></svg>
    <svg class="spud" style="--x:23%;--size:4.5rem;--time:33s;--delay:-9s;--drift:-4vw;--spin:200deg;--rest:24%;--skin:#c58b4e;--line:#7a4a22"><use href="#potato"/></svg>
    <svg class="spud" style="--x:49%;--size:5.25rem;--time:38s;--delay:-33s;--drift:5vw;--spin:-120deg;--rest:92%;--skin:#8d62c4;--line:#4b2c7c"><use href="#potato"/></svg>
    <svg class="spud" style="--x:62%;--size:3.25rem;--time:26s;--delay:-6s;--drift:-2vw;--spin:300deg;--rest:40%;--skin:#b5583a;--line:#6e2c1a"><use href="#potato"/></svg>
  </div>

  <header class="site-header">
    <a class="wordmark" href="index.html">Potato Galaxy</a>
    <nav class="site-nav" aria-label="Main">
      <a href="index.html" aria-current="page">Home</a>
      <a href="index.html#games">Games</a>
      <a href="privacy.html">Privacy</a>
    </nav>
  </header>

  <main id="main">
    <!-- Hero: the illustration is the first thing visitors see -->
    <div class="hero">
      <!-- alt text describes the image for screen readers and shows if the file fails to load -->
      <img src="images/hero.jpg" width="1408" height="768"
           alt="Cartoon potato planets with smiling faces floating in a colorful galaxy, with a small astronaut flying a potato-shaped rocket.">
      <div class="hero-text">
        <div class="wrap">
          <h1>Potato Galaxy</h1>
          <p>Mobile games for iPhone and Android.</p>
        </div>
      </div>
    </div>

    <!-- Games list -->
    <section id="games" class="wrap">
      <h2>Games</h2>

      <article class="game">
        <span class="status">In development</span>
        <h3>Potato Galaxy Sudoku</h3>
        <p>A sudoku game with a puppy theme.</p>
        <a class="btn" href="games/potato-galaxy-sudoku.html">See the game</a>
      </article>

      <p style="margin-top:1.5rem;color:var(--dim)">More games are on the way.</p>
    </section>
  </main>

  <footer class="site-footer">
    <span>&copy; 2026 Potato Galaxy</span>
    <span class="footer-links">
      <a href="privacy.html">Privacy policy</a>
      <a href="terms.html">Terms of service</a>
    </span>
  </footer>
</body>
</html>
